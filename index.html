<body><main><header><h1><span class="mark" aria-hidden="true">⁖</span>On My Mind</h1><div class="header-actions"><button id="auth" class="quiet" hidden>Sign in</button><button id="new-topic" class="primary">+ Add topic</button></div></header><p id="error" class="error" role="alert" hidden></p><nav class="tabs" aria-label="View"><button id="topics-tab" aria-pressed="true">Topics</button><button id="map-tab" aria-pressed="false">Map</button></nav><section id="view"></section><footer class="footer"><span id="save-status" role="status">Saved on this device.</span> <button class="quiet" id="backup">Download backup</button></footer></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2><label id="field-label" for="entry"></label><div id="field"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>

<dialog id="auth-dialog" aria-labelledby="auth-title"><form id="auth-form"><h2 id="auth-title">Sync your thoughts</h2><p class="auth-copy">Use the same email on every device.</p><label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"><p id="auth-message" class="date" role="status"></p><div class="dialog-actions"><button type="button" id="auth-cancel">Cancel</button><button class="primary" type="submit">Send sign-in link</button></div></form></dialog>

<script>
'use strict';
const KEY='things-on-my-mind.v1',QUEUE_KEY='things-on-my-mind.sync-queue.v1';let topics=[],selected=null,editing=null,deleting=null,blocked=false,mode='topics',lastRaw=null,supabase=null,authUser=null,syncing=false;
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(message){$('error').textContent=message;$('error').hidden=false}
function valid(data){return Array.isArray(data)&&data.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&Number.isFinite(t.created)&&Array.isArray(t.thoughts)&&t.thoughts.every(n=>n&&typeof n.id==='string'&&typeof n.text==='string'&&Number.isFinite(n.created)&&Number.isFinite(n.updated)&&(n.buildsOn===undefined||typeof n.buildsOn==='string')))}
try{const raw=localStorage.getItem(KEY);lastRaw=raw;if(raw){const data=JSON.parse(raw);if(!valid(data))throw Error();topics=data}}catch{blocked=true;error('Your saved thoughts could not be read. Reload or check browser storage before making changes. Existing data has not been overwritten.')}
function queue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch{return[]}}
function setQueue(next){localStorage.setItem(QUEUE_KEY,JSON.stringify(next))}
function cache(next){const serialized=JSON.stringify(next);localStorage.setItem(KEY,serialized);lastRaw=serialized;topics=next;navigator.storage?.persist?.().catch(()=>{});$('error').hidden=true;render()}
function recordDeletes(previous,next){const actions=queue(),nextTopics=new Map(next.map(t=>[t.id,t]));for(const topic of previous){const replacement=nextTopics.get(topic.id);if(!replacement){actions.push({type:'topic',id:topic.id});continue}const kept=new Set(replacement.thoughts.map(n=>n.id));for(const thought of topic.thoughts)if(!kept.has(thought.id))actions.push({type:'thought',id:thought.id})}setQueue(actions)}
function save(next){if(blocked)return false;try{if(localStorage.getItem(KEY)!==lastRaw){error('Your log changed in another window. Reload before saving to avoid overwriting it. Your text is still here.');return false}recordDeletes(topics,next);cache(next);flushRemote();return true}catch{error('Could not save. Your browser storage may be full or unavailable. Please keep this window open and try again.');return false}}
const uid=()=>crypto.randomUUID(),date=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',...(new Date(t).getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})});
const current=()=>topics.find(t=>t.id===selected),ordered=t=>[...t.thoughts].sort((a,b)=>b.created-a.created),latest=t=>[...t.thoughts].sort((a,b)=>b.updated-a.updated)[0],excerpt=s=>s.replace(/\s+/g,' ').slice(0,80)+(s.replace(/\s+/g,' ').length>80?'…':'');
function render(){let t=current();if(selected&&!t)selected=null;$('new-topic').hidden=!!t;$('topics-tab').setAttribute('aria-pressed',String(mode==='topics'));$('map-tab').setAttribute('aria-pressed',String(mode==='map'));if(!t&&mode==='map'&&topics.length){renderMap();return}if(!t){$('view').innerHTML=topics.length?'<p class="eyebrow">Your topics</p><div class="grid">'+topics.map(t=>{let n=latest(t);return `<button class="card" data-open="${esc(t.id)}"><span class="card-title">${esc(t.name)}</span><span class="excerpt">${n?esc(n.text):'No thoughts yet.'}</span><span class="date">${n?'Updated '+date(n.updated):'Created '+date(t.created)}</span></button>`}).join('')+'</div>':'<div class="empty"><div class="empty-symbol" aria-hidden="true">⁖</div><h2>What’s on your mind?</h2><p>Give it a topic. Let your thoughts collect over time.</p><button class="primary" data-add-topic>+ Add your first topic</button></div>';return}
$('view').innerHTML=`<div class="detail"><button class="quiet back" data-back>← All topics</button><div class="detail-head"><h2>${esc(t.name)}</h2><div class="actions"><button class="quiet" data-rename>Edit topic</button><button class="quiet danger" data-delete-topic>Delete topic</button></div></div><button class="primary" data-add-thought>+ Add thought</button><div class="timeline">${t.thoughts.length?ordered(t).map(n=>{const parent=t.thoughts.find(p=>p.id===n.buildsOn);return `<article class="thought" id="thought-${esc(n.id)}"><div class="thought-top"><time class="date" datetime="${new Date(n.created).toISOString()}">${date(n.created)}${n.updated!==n.created?' · edited':''}</time><div><button class="quiet" data-edit="${esc(n.id)}" aria-label="Edit thought from ${date(n.created)}">Edit</button><button class="quiet danger" data-delete="${esc(n.id)}" aria-label="Delete thought from ${date(n.created)}">Delete</button></div></div><p>${esc(n.text)}</p>${parent?`<button class="builds-on" data-builds-on="${esc(parent.id)}" title="Builds on ${date(parent.created)} — ${esc(parent.text)}">Builds on ${date(parent.created)} — ${esc(excerpt(parent.text))}</button>`:''}</article>`}).join(''):'<p class="date">A place for the first thought, and the ones that follow.</p>'}</div></div>`}
function editor(kind,id){editing={kind,id};let thought=id&&current()?.thoughts.find(n=>n.id===id),isTopic=kind==='topic',candidates=!isTopic?current().thoughts.filter(n=>n.id!==id&&(!thought||n.created<thought.created)).sort((a,b)=>b.created-a.created):[];$('editor-title').textContent=isTopic?(id?'Edit topic':'Add a topic'):(id?'Edit thought':'Add a thought');$('field-label').textContent=isTopic?'Topic name':date(Date.now());$('field').innerHTML=isTopic?'<input id="entry" maxlength="120" required placeholder="What are you thinking about?" autocomplete="off">':`<textarea id="entry" maxlength="10000" required placeholder="A thought to come back to…"></textarea>${candidates.length?`<div class="builds-select"><label for="builds-on">Builds on <span class="date">optional</span></label><select id="builds-on"><option value="">Nothing earlier</option>${candidates.map(n=>`<option value="${esc(n.id)}">${date(n.created)} — ${esc(excerpt(n.text))}</option>`).join('')}</select></div>`:''}`;$('entry').value=isTopic?(id?current().name:''):(thought?.text||'');if(thought?.buildsOn&&$('builds-on'))$('builds-on').value=thought.buildsOn;$('editor').showModal();$('entry').focus()}
function confirmDelete(kind,id){deleting={kind,id};$('confirm-title').textContent=kind==='topic'?'Delete this topic?':'Delete this thought?';$('confirm-copy').textContent=kind==='topic'?'This topic and all its thoughts will be permanently deleted.':'This thought will be permanently deleted.';$('confirm').showModal();$('keep').focus()}
$('new-topic').onclick=()=>editor('topic');$('cancel').onclick=()=>$('editor').close();$('keep').onclick=()=>$('confirm').close();
$('view').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-open')){selected=b.dataset.open;render();if(b.dataset.thought)document.getElementById('thought-'+b.dataset.thought)?.scrollIntoView({block:'center'})}else if(b.hasAttribute('data-builds-on')){const target=$('thought-'+b.dataset.buildsOn);target?.scrollIntoView({block:'center'});target?.animate([{backgroundColor:'#30263e'},{backgroundColor:'transparent'}],{duration:1300})}else if(b.hasAttribute('data-back')){selected=null;render()}else if(b.hasAttribute('data-add-topic'))editor('topic');else if(b.hasAttribute('data-rename'))editor('topic',selected);else if(b.hasAttribute('data-add-thought'))editor('thought');else if(b.hasAttribute('data-edit'))editor('thought',b.dataset.edit);else if(b.hasAttribute('data-delete'))confirmDelete('thought',b.dataset.delete);else if(b.hasAttribute('data-delete-topic'))confirmDelete('topic',selected)};
$('editor-form').onsubmit=e=>{e.preventDefault();const value=$('entry').value.trim();if(!value){$('entry').setCustomValidity('Write something before saving.');$('entry').reportValidity();return}const next=structuredClone(topics),now=Date.now();if(editing.kind==='topic'){if(editing.id)next.find(t=>t.id===editing.id).name=value;else next.push({id:uid(),name:value,created:now,thoughts:[]})}else{const t=next.find(t=>t.id===selected);if(!t){$('editor').close();return}const buildsOn=$('builds-on')?.value||undefined;if(editing.id){const n=t.thoughts.find(n=>n.id===editing.id);if(!n){$('editor').close();return}n.text=value;n.updated=now;n.buildsOn=buildsOn}else t.thoughts.push({id:uid(),text:value,created:now,updated:now,buildsOn})}if(save(next))$('editor').close()};
$('field').oninput=()=>$('entry').setCustomValidity('');$('remove').onclick=()=>{let next=structuredClone(topics);if(deleting.kind==='topic')next=next.filter(t=>t.id!==deleting.id);else{let t=next.find(t=>t.id===selected);if(t){t.thoughts=t.thoughts.filter(n=>n.id!==deleting.id);t.thoughts.forEach(n=>{if(n.buildsOn===deleting.id)delete n.buildsOn})}}if(save(next))$('confirm').close()};
function updateAuth(){const button=$('auth');button.hidden=!supabase;if(!supabase){$('save-status').textContent='Saved on this device.';return}button.textContent=authUser?'Sign out':'Sign in';$('save-status').textContent=authUser?'Synced to your account.':'Saved on this device. Sign in to sync.'}
function mergeThoughts(localThoughts,remoteThoughts){const all=new Map();for(const thought of [...localThoughts,...remoteThoughts]){const current=all.get(thought.id);if(!current||thought.updated>current.updated)all.set(thought.id,thought)}return [...all.values()]}
function mergeCloud(remoteTopics,remoteThoughts){const localById=new Map(topics.map(t=>[t.id,t])),remoteByTopic=new Map();for(const thought of remoteThoughts){const list=remoteByTopic.get(thought.topic_id)||[];list.push({id:thought.id,text:thought.text,created:Date.parse(thought.created_at),updated:Date.parse(thought.updated_at),buildsOn:thought.builds_on_thought_id||undefined});remoteByTopic.set(thought.topic_id,list)}const merged=[];for(const remote of remoteTopics){const local=localById.get(remote.id);merged.push({id:remote.id,name:local?.name||remote.name,created:local?.created||Date.parse(remote.created_at),thoughts:mergeThoughts(local?.thoughts||[],remoteByTopic.get(remote.id)||[])});localById.delete(remote.id)}for(const topic of localById.values())merged.push(topic);return merged}
async function loadCloud(){if(!supabase||!authUser)return;const [{data:remoteTopics,error:topicError},{data:remoteThoughts,error:thoughtError}]=await Promise.all([supabase.from('topics').select('*').order('created_at'),supabase.from('thoughts').select('*').order('created_at')]);if(topicError||thoughtError){error('Could not load your synced thoughts. Your local copy is still available.');return}const merged=mergeCloud(remoteTopics||[],remoteThoughts||[]);if(JSON.stringify(merged)!==JSON.stringify(topics)){cache(merged);setQueue([...queue(),{type:'sync'}])}if((remoteTopics||[]).length===0&&topics.length)setQueue([...queue(),{type:'sync'}]);await flushRemote()}
async function flushRemote(){if(syncing||!supabase||!authUser||!navigator.onLine)return;syncing=true;try{const actions=queue();for(const action of actions){const table=action.type==='topic'?'topics':'thoughts';const {error:deleteError}=await supabase.from(table).delete().eq('id',action.id).eq('user_id',authUser.id);if(deleteError)throw deleteError}const topicRows=topics.map(t=>({id:t.id,user_id:authUser.id,name:t.name,created_at:new Date(t.created).toISOString(),updated_at:new Date().toISOString()}));if(topicRows.length){const {error:topicError}=await supabase.from('topics').upsert(topicRows);if(topicError)throw topicError}const thoughtRows=topics.flatMap(t=>t.thoughts.map(n=>({id:n.id,topic_id:t.id,user_id:authUser.id,text:n.text,created_at:new Date(n.created).toISOString(),updated_at:new Date(n.updated).toISOString(),builds_on_thought_id:n.buildsOn||null})));if(thoughtRows.length){const {error:thoughtError}=await supabase.from('thoughts').upsert(thoughtRows);if(thoughtError)throw thoughtError}setQueue([]);$('save-status').textContent='Synced to your account.'}catch{if(navigator.onLine)error('Your latest change is saved on this device and will retry syncing.')}finally{syncing=false}}
async function initializeSupabase(){supabase=window.onMyMindSupabase;if(!supabase){updateAuth();return}updateAuth();const {data:{session}}=await supabase.auth.getSession();authUser=session?.user||null;updateAuth();if(authUser)await loadCloud();supabase.auth.onAuthStateChange(async(_event,session)=>{authUser=session?.user||null;updateAuth();if(authUser)await loadCloud()})}
$('auth').onclick=async()=>{if(authUser){await supabase.auth.signOut();return}$('auth-dialog').showModal();$('auth-email').focus()};$('auth-cancel').onclick=()=>$('auth-dialog').close();$('auth-form').onsubmit=async event=>{event.preventDefault();const email=$('auth-email').value.trim(),message=$('auth-message');message.textContent='Sending…';const {error:authError}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});message.textContent=authError?'Could not send the link. Try again.':'Check your email for the sign-in link.'};
window.addEventListener('on-my-mind-supabase-ready',initializeSupabase);window.addEventListener('online',flushRemote);if(window.onMyMindSupabase!==undefined)initializeSupabase();
window.addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==null)return;try{const next=e.newValue?JSON.parse(e.newValue):[];if(!valid(next))throw Error();topics=next;lastRaw=e.newValue;render()}catch{blocked=true;error('Saved data changed unexpectedly. Reload before editing.')}});render();

function renderMap(){
 let y=210,lines='',nodes='',height=420,positions={};
 for(const t of topics){
  const count=t.thoughts.length,r=Math.max(155,count*37),cy=y+Math.max(0,r-155),cx=Math.max(470,r+110);
  nodes+=`<button class="map-node topic-node" style="left:${cx}px;top:${cy}px" data-open="${esc(t.id)}"><span>${esc(t.name)}</span></button>`;
  ordered(t).forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/count,x=cx+Math.cos(a)*Math.max(260,r),ny=cy+Math.sin(a)*r;
   positions[n.id]={x,y:ny};
   lines+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${ny}" stroke="#675277" stroke-width="1"/>`;
   nodes+=`<button class="map-node" style="left:${x}px;top:${ny}px" data-open="${esc(t.id)}" data-thought="${esc(n.id)}" title="${esc(n.text)}"><small>${date(n.created)}</small><span>${esc(n.text)}</span></button>`;
  });
  height=cy+r+70;y=height+210;
 }
 for(const t of topics)for(const n of t.thoughts){const parent=positions[n.buildsOn],child=positions[n.id];if(parent&&child)lines+=`<line class="map-builds" x1="${child.x}" y1="${child.y}" x2="${parent.x}" y2="${parent.y}"/>`}
 const width=Math.max(940,...topics.map(t=>940+Math.max(0,t.thoughts.length*37-260)*2));
 $('view').innerHTML=`<p class="map-hint">Each topic connects to its thoughts. Dashed lines show what a thought builds on. Select a node to open its history.</p><div class="map-viewport" tabindex="0" aria-label="Topic map. Scroll to explore."><div class="map-canvas" style="width:${width}px;height:${height}px"><svg width="${width}" height="${height}" aria-hidden="true">${lines}</svg>${nodes}</div></div>`;
 const viewport=document.querySelector('.map-viewport');viewport.scrollLeft=Math.max(0,Math.max(470,topics[0].thoughts.length*37+110)-viewport.clientWidth/2);
}
for(const view of ['topics','map'])$(view+'-tab').onclick=()=>{mode=view;selected=null;render()};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(topics,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='on-my-mind-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{$('save-status').textContent='Saved on this device. Offline setup unavailable; reload to retry.'});
</script></body></html>
