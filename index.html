<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17171b"><meta name="description" content="A tiny personal thinking log.">
<title>Things on My Mind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317171b'/%3E%3Cpath d='M9 22L16 9l8 10' stroke='%23b5a0ed' fill='none'/%3E%3Cg fill='%23b5a0ed'%3E%3Ccircle cx='9' cy='22' r='3'/%3E%3Ccircle cx='16' cy='9' r='3'/%3E%3Ccircle cx='24' cy='19' r='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#17171b;--panel:#202025;--line:#34333d;--text:#eceaf0;--muted:#aaa6b3;--accent:#bba6ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:1px solid var(--line);border-radius:9px;color:var(--text);background:transparent;padding:9px 16px;transition:background .15s,border-color .15s}button:hover{background:#2d2b35;border-color:#696174}.primary{background:var(--accent);border-color:var(--accent);color:#211a30;font-weight:600}.primary:hover{background:#ccbaf5}.quiet{border-color:transparent;color:var(--muted)}.danger{color:#f0a7ac}main{max-width:1056px;margin:0 auto;padding:64px 32px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-bottom:32px;border-bottom:1px solid var(--line)}h1{font-weight:500;font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:23px;line-height:1.4;font-weight:500;margin:0 0 20px}p{margin:0}.mark{color:var(--accent);font-size:22px;margin-right:12px}.eyebrow{color:var(--muted);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;margin:30px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{text-align:left;display:flex;flex-direction:column;min-height:210px;padding:24px;background:var(--panel);border-radius:12px}.card:hover{background:#25242c;border-color:#807095}.card-title{font-size:19px;font-weight:500;overflow-wrap:anywhere;display:block}.card-title:before{content:'';display:inline-block;width:7px;height:7px;border:1px solid var(--accent);border-radius:50%;margin:0 11px 3px 0}.excerpt{color:#c5c1cd;margin:16px 0 24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}.date{color:var(--muted);font-size:13px;margin-top:auto}.empty{padding:100px 20px 110px;text-align:center}.empty-symbol{color:var(--accent);font-size:38px;margin-bottom:22px}.empty h2{margin-bottom:8px}.empty p{color:var(--muted);margin-bottom:26px}.footer{margin-top:48px;font-size:13px;color:#96919f}.back{margin:24px 0 20px;padding-left:0}.detail{max-width:720px;margin:auto}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.detail-head h2{font-size:30px;overflow-wrap:anywhere;margin-bottom:8px}.actions{display:flex;gap:4px;flex-wrap:wrap}.thought{padding:26px 0 26px 24px;border-left:1px solid var(--line);position:relative}.thought:before{content:'';position:absolute;left:-4px;top:35px;width:7px;height:7px;background:var(--bg);border:1px solid #8d7bae;border-radius:50%}.thought-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.thought p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;font-size:17px}.thought .quiet{font-size:13px;padding:3px 8px}.timeline{margin-top:30px}dialog{background:#242329;color:var(--text);border:1px solid #4b4556;border-radius:16px;padding:30px;width:min(520px,calc(100% - 32px));box-shadow:0 24px 100px #0008}dialog::backdrop{background:#08080cbb;backdrop-filter:blur(4px)}label{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}input,textarea{width:100%;background:#19181e;color:var(--text);border:1px solid #49434f;border-radius:8px;padding:12px}textarea{min-height:180px;resize:vertical;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.delete-copy{color:#c5c1cd}.error{color:#f0a7ac;margin:20px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{padding:30px 20px}header{gap:12px}h1{font-size:22px}.mark{display:none}header button{white-space:nowrap;padding:8px 12px}.grid{grid-template-columns:1fr}.empty{padding:75px 0}.detail-head{flex-direction:column}.card{min-height:180px}dialog{padding:24px}}
</style>
</head>
<body><main><header><h1><span class="mark" aria-hidden="true">⁖</span>Things on My Mind</h1><button id="new-topic" class="primary">+ Add topic</button></header><p id="error" class="error" role="alert" hidden></p><section id="view"></section><footer class="footer">Saved in this browser. Just for you.</footer></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><h2 id="editor-title"></h2><label id="field-label" for="entry"></label><div id="field"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-copy"><h2 id="confirm-title"></h2><p class="delete-copy" id="confirm-copy"></p><div class="dialog-actions"><button id="keep">Cancel</button><button id="remove" class="danger">Delete</button></div></dialog>
<script>
'use strict';
const KEY='things-on-my-mind.v1';let topics=[],selected=null,editing=null,deleting=null,blocked=false;
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(message){$('error').textContent=message;$('error').hidden=false}
function valid(data){return Array.isArray(data)&&data.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&Number.isFinite(t.created)&&Array.isArray(t.thoughts)&&t.thoughts.every(n=>n&&typeof n.id==='string'&&typeof n.text==='string'&&Number.isFinite(n.created)&&Number.isFinite(n.updated)))}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!valid(data))throw Error();topics=data}}catch{blocked=true;error('Your saved thoughts could not be read. Reload or check browser storage before making changes. Existing data has not been overwritten.')}
function save(next){if(blocked)return false;try{localStorage.setItem(KEY,JSON.stringify(next));topics=next;$('error').hidden=true;render();return true}catch{error('Could not save. Your browser storage may be full or unavailable. Please keep this window open and try again.');return false}}
const uid=()=>crypto.randomUUID(),date=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',...(new Date(t).getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})});
const current=()=>topics.find(t=>t.id===selected),ordered=t=>[...t.thoughts].sort((a,b)=>b.created-a.created),latest=t=>[...t.thoughts].sort((a,b)=>b.updated-a.updated)[0];
function render(){let t=current();if(selected&&!t)selected=null;$('new-topic').hidden=!!t;if(!t){$('view').innerHTML=topics.length?'<p class="eyebrow">Your topics</p><div class="grid">'+topics.map(t=>{let n=latest(t);return `<button class="card" data-open="${esc(t.id)}"><span class="card-title">${esc(t.name)}</span><span class="excerpt">${n?esc(n.text):'No thoughts yet.'}</span><span class="date">${n?'Updated '+date(n.updated):'Created '+date(t.created)}</span></button>`}).join('')+'</div>':'<div class="empty"><div class="empty-symbol" aria-hidden="true">⁖</div><h2>What’s on your mind?</h2><p>Give it a topic. Let your thoughts collect over time.</p><button class="primary" data-add-topic>+ Add your first topic</button></div>';return}
$('view').innerHTML=`<div class="detail"><button class="quiet back" data-back>← All topics</button><div class="detail-head"><h2>${esc(t.name)}</h2><div class="actions"><button class="quiet" data-rename>Edit topic</button><button class="quiet danger" data-delete-topic>Delete topic</button></div></div><button class="primary" data-add-thought>+ Add thought</button><div class="timeline">${t.thoughts.length?ordered(t).map(n=>`<article class="thought"><div class="thought-top"><time class="date" datetime="${new Date(n.created).toISOString()}">${date(n.created)}${n.updated!==n.created?' · edited':''}</time><div><button class="quiet" data-edit="${esc(n.id)}" aria-label="Edit thought from ${date(n.created)}">Edit</button><button class="quiet danger" data-delete="${esc(n.id)}" aria-label="Delete thought from ${date(n.created)}">Delete</button></div></div><p>${esc(n.text)}</p></article>`).join(''):'<p class="date">A place for the first thought, and the ones that follow.</p>'}</div></div>`}
function editor(kind,id){editing={kind,id};let thought=id&&current()?.thoughts.find(n=>n.id===id),isTopic=kind==='topic';$('editor-title').textContent=isTopic?(id?'Edit topic':'Add a topic'):(id?'Edit thought':'Add a thought');$('field-label').textContent=isTopic?'Topic name':date(Date.now());$('field').innerHTML=isTopic?'<input id="entry" maxlength="120" required placeholder="What are you thinking about?" autocomplete="off">':'<textarea id="entry" maxlength="10000" required placeholder="A thought to come back to…"></textarea>';$('entry').value=isTopic?(id?current().name:''):(thought?.text||'');$('editor').showModal();$('entry').focus()}
function confirmDelete(kind,id){deleting={kind,id};$('confirm-title').textContent=kind==='topic'?'Delete this topic?':'Delete this thought?';$('confirm-copy').textContent=kind==='topic'?'This topic and all its thoughts will be permanently deleted.':'This thought will be permanently deleted.';$('confirm').showModal();$('keep').focus()}
$('new-topic').onclick=()=>editor('topic');$('cancel').onclick=()=>$('editor').close();$('keep').onclick=()=>$('confirm').close();
$('view').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-open')){selected=b.dataset.open;render()}else if(b.hasAttribute('data-back')){selected=null;render()}else if(b.hasAttribute('data-add-topic'))editor('topic');else if(b.hasAttribute('data-rename'))editor('topic',selected);else if(b.hasAttribute('data-add-thought'))editor('thought');else if(b.hasAttribute('data-edit'))editor('thought',b.dataset.edit);else if(b.hasAttribute('data-delete'))confirmDelete('thought',b.dataset.delete);else if(b.hasAttribute('data-delete-topic'))confirmDelete('topic',selected)};
$('editor-form').onsubmit=e=>{e.preventDefault();const value=$('entry').value.trim();if(!value){$('entry').setCustomValidity('Write something before saving.');$('entry').reportValidity();return}const next=structuredClone(topics),now=Date.now();if(editing.kind==='topic'){if(editing.id)next.find(t=>t.id===editing.id).name=value;else next.push({id:uid(),name:value,created:now,thoughts:[]})}else{const t=next.find(t=>t.id===selected);if(!t){$('editor').close();return}if(editing.id){const n=t.thoughts.find(n=>n.id===editing.id);if(!n){$('editor').close();return}n.text=value;n.updated=now}else t.thoughts.push({id:uid(),text:value,created:now,updated:now})}if(save(next))$('editor').close()};
$('field').oninput=()=>$('entry').setCustomValidity('');$('remove').onclick=()=>{let next=structuredClone(topics);if(deleting.kind==='topic')next=next.filter(t=>t.id!==deleting.id);else{let t=next.find(t=>t.id===selected);if(t)t.thoughts=t.thoughts.filter(n=>n.id!==deleting.id)}if(save(next))$('confirm').close()};
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const next=e.newValue?JSON.parse(e.newValue):[];if(!valid(next))throw Error();topics=next;render()}catch{blocked=true;error('Saved data changed unexpectedly. Reload before editing.')}});render();
</script></body></html>
